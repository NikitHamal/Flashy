name: Release Flashy Desktop

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Python Backend Sidecar
        shell: bash
        run: |
          python -m PyInstaller src-tauri/pyinstaller/flashy-backend.spec --noconfirm --clean
          mkdir -p src-tauri/binaries
          mv dist/flashy-backend.exe src-tauri/binaries/flashy-backend-x86_64-pc-windows-msvc.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Tauri Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          cp src-tauri/icons/icon.png src-tauri/icons/128x128.png
          cp src-tauri/icons/icon.png src-tauri/icons/128x128@2x.png
          cp src-tauri/icons/icon.png src-tauri/icons/32x32.png
          cp src-tauri/icons/icon.png src-tauri/icons/icon.icns

      - name: Build Tauri Application
        run: |
          npm install @tauri-apps/cli@1.6
          npx tauri build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flashy-Desktop-Installer-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
