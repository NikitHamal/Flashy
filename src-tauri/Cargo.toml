[package]
name = "flashy"
version = "0.1.0"
description = "Flashy Native Desktop Shell"
authors = ["NikitHamal <iamnikithamal@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.6", features = [
    "process-command-api",
    "shell-open-api",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

