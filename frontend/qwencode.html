<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Code UI | Flashy</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/css/qwencode.css">
</head>
<body>
    <div class="qwen-sidebar">
        <div class="qwen-header">
            <div class="logo">⚡</div>
            <h2>Qwen Code UI</h2>
        </div>
        
        <div class="qwen-settings">
            <div class="setting-group">
                <label>Provider</label>
                <select id="auth-type-select">
                    <option value="qwen-free">Qwen Free</option>
                    <option value="deepinfra-free">DeepInfra Free</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label>Model</label>
                <select id="model-select">
                    <option value="qwen3.6-plus">qwen3.6-plus</option>
                    <option value="qwen3.5-plus">qwen3.5-plus</option>
                    <option value="qwen3-coder-plus">qwen3-coder-plus</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label>Workspace Folder</label>
                <div class="workspace-picker">
                    <input type="text" id="workspace-input" placeholder="Select a project folder..." readonly>
                    <button class="btn-pick-folder" id="btn-pick-folder">
                        <span class="material-symbols-outlined">folder_open</span>
                        Browse
                    </button>
                </div>
            </div>
        </div>
        
        <div class="return-home">
            <button class="btn-return" onclick="window.location.href='/'">
                <span class="material-symbols-outlined">arrow_back</span>
                Return to Flashy
            </button>
        </div>
    </div>

    <div class="qwen-main">
        <div class="chat-container">
            <div class="chat-history" id="chat-history">
                <div class="msg-bubble msg-system">Qwen Code Engine initialized. Ready to assist.</div>
            </div>
            
            <div class="input-area-wrapper">
                <div class="input-area">
                    <textarea id="message-input" placeholder="Type your message or request..." rows="1"></textarea>
                    <button id="btn-send" class="btn-send">
                        <span class="material-symbols-outlined">send</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/qwencode.js"></script>
</body>
</html>
