<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashy | Computer Use</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/css/computer-use.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
    <div class="cu-shell">
        <aside class="cu-sidebar">
            <div class="cu-sidebar-header">
                <div class="cu-brand">
                    <span class="material-symbols-outlined">flash_on</span>
                    <span>Computer Use</span>
                </div>
                <a href="/" class="cu-btn-icon" title="Back to Flashy">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
            </div>

            <div class="cu-sidebar-section">
                <div class="cu-section-title">
                    <span>Sessions</span>
                    <button id="btn-new-session" class="cu-btn-icon" title="New Session">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                </div>
                <div id="session-list" class="cu-session-list"></div>
            </div>

            <div class="cu-sidebar-footer">
                <div style="font-size:11px; color:var(--text-secondary); padding:0 4px; line-height:1.5;">Autonomous desktop operator. Select a model and give it a task.</div>
            </div>
        </aside>

        <main class="cu-main">
            <div class="cu-top-bar">
                <div class="cu-top-bar-left">
                    <div id="session-status-pill" class="cu-status-pill idle">idle</div>
                    <h2 id="session-title" class="cu-session-title">Select or create a session</h2>
                </div>
                <div class="cu-top-bar-right">
                    <button id="btn-interrupt" class="cu-btn-danger hidden">
                        <span class="material-symbols-outlined" style="font-size:16px">stop_circle</span>Stop
                    </button>
                </div>
            </div>

            <div id="feed" class="cu-feed">
                <div class="cu-feed-empty">Create a session and send a task like "Open Notepad and type Hello World." The assistant will plan and execute actions on your desktop.</div>
            </div>

            <div class="cu-composer-area">
                <div class="cu-composer-surface">
                    <textarea id="task-input" placeholder="Tell Flashy what to do on your computer..."></textarea>
                    <div class="cu-composer-footer">
                        <div class="cu-composer-controls">
                            <select id="provider-select" class="cu-select">
                                <option value="airforce">Airforce</option>
                                <option value="deepinfra">DeepInfra</option>
                                <option value="qwen">Qwen</option>
                                <option value="gradient">Gradient</option>
                            </select>
                            <select id="model-select" class="cu-select"></select>
                        </div>
                        <button id="btn-send-task" class="cu-btn-send" aria-label="Send task">
                            <span class="material-symbols-outlined">arrow_upward</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/computer-use/api.js"></script>
    <script src="/js/computer-use/state.js"></script>
    <script src="/js/computer-use/ui.js"></script>
    <script src="/js/computer-use/app.js"></script>
</body>
</html>
